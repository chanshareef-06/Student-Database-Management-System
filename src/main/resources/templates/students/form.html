<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title=(${student.id} != null ? 'Edit Student' : 'New Student'))}"></head>
<body><header th:replace="~{fragments :: nav}"></header>

<main class="container">
    <h1 th:text="${student.id} != null ? 'Edit Student' : 'New Student'">Student Form</h1>

    <form th:action="@{/students/save}" th:object="${student}" method="post" class="form">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" th:field="*{name}" placeholder="e.g. Jane Doe"/>
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="e.g. jane.doe@example.com"/>
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" th:field="*{phone}" placeholder="e.g. +1 555 123 4567"/>
            <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </div>

        <div class="form-group">
            <label for="dateOfBirth">Date of Birth</label>
            <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}"/>
        </div>

        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" th:field="*{gender}">
                <option value="">-- Select --</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" th:field="*{address}" rows="3" placeholder="Street, City, State"></textarea>
        </div>

        <div class="button-row">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/students}" class="btn btn-link">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
