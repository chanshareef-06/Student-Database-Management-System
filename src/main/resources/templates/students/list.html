<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Students')}"></head><body>
<header th:replace="~{fragments :: nav}"></header>

<main class="container">
    <div class="page-header">
        <h1>Students</h1>
        <a th:href="@{/students/new}" class="btn btn-primary">+ New Student</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/students}" method="get" class="search-form">
        <input type="text" name="keyword" placeholder="Search by name..." th:value="${keyword}"/>
        <button type="submit" class="btn btn-secondary">Search</button>
        <a th:href="@{/students}" class="btn btn-link">Clear</a>
    </form>

    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="5" class="empty-state">No students found.</td>
        </tr>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}">1</td>
            <td>
                <a th:href="@{/students/{id}(id=${student.id})}" th:text="${student.name}">Name</a>
            </td>
            <td th:text="${student.email}">email@example.com</td>
            <td th:text="${student.phone}">000-000-0000</td>
            <td class="actions">
                <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-small btn-secondary">Edit</a>
                <a th:href="@{/students/{id}/delete(id=${student.id})}"
                   class="btn btn-small btn-danger"
                   onclick="return confirm('Delete this student? This will also remove their enrollments.');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
