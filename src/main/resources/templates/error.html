<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>

<main class="container">
    <h1>Something went wrong</h1>
    <div class="alert alert-error" th:text="${errorMessage}">Error message</div>
    <a th:href="@{/}" class="btn btn-primary">Back to Dashboard</a>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
