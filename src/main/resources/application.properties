# =========================================
# Application
# =========================================
spring.application.name=student-course-management
server.port=8000

# =========================================
# MySQL Database Configuration
# Update these values to match your local MySQL setup
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/scms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate Configuration
# =========================================
# update: keeps schema changes automatically (create tables on first run, alter after)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# =========================================
# Thymeleaf Configuration
# =========================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# =========================================
# Logging
# =========================================
logging.level.org.springframework=INFO
logging.level.com.scms=DEBUG
